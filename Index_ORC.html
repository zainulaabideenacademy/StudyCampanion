<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Study Companion — Grade 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Work+Sans:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F7F4EC;
  --paper-2:#EFEADC;
  --ink:#26241F;
  --ink-soft:#5B564C;
  --line:#DED6C3;
  --good:#2E7D4F;
  --good-bg:#E1F0E5;
  --warn:#B8622E;
  --warn-bg:#F6E6D8;
  --bad:#B23A3A;
  --bad-bg:#F7E1DF;
  --gold:#C9A227;
  --radius:18px;
  --radius-sm:10px;
  --shadow:0 6px 20px rgba(38,36,31,0.08);
  --shadow-lift:0 14px 34px rgba(38,36,31,0.16);
  --font-scale:1;
  font-size:calc(16px * var(--font-scale));
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  background-image:
    radial-gradient(circle at 100% 0%, rgba(201,162,39,0.07), transparent 45%),
    radial-gradient(circle at 0% 100%, rgba(122,31,61,0.05), transparent 40%);
  color:var(--ink);
  font-family:'Work Sans', sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:'Baloo 2', sans-serif;}
.urdu{font-family:'Noto Nastaliq Urdu', serif; line-height:2.4; direction:rtl;}
#app{max-width:960px;margin:0 auto;padding:20px 18px 64px;min-height:100vh;}
button{font-family:inherit;cursor:pointer;}
a{color:inherit;}

/* ---------- Top bar ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;gap:10px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;}
.brand-mark{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#7A1F3D,#1F5FA8 60%,#B8622E);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;box-shadow:var(--shadow);flex-shrink:0;}
.brand-text{font-family:'Baloo 2',sans-serif;font-weight:600;font-size:1.15rem;letter-spacing:-0.01em;}
.brand-text small{display:block;font-family:'Work Sans',sans-serif;font-weight:500;font-size:0.68rem;color:var(--ink-soft);letter-spacing:.06em;text-transform:uppercase;}
.top-actions{display:flex;gap:8px;align-items:center;}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;transition:transform .15s ease, box-shadow .15s ease;}
.icon-btn:hover{transform:translateY(-1px);box-shadow:var(--shadow);}
.font-controls{display:flex;align-items:center;border:1px solid var(--line);border-radius:20px;background:#fff;overflow:hidden;}
.font-controls button{border:none;background:transparent;padding:8px 12px;font-weight:600;font-size:0.85rem;color:var(--ink-soft);}
.font-controls button:hover{background:var(--paper-2);}

/* ---------- Breadcrumb ---------- */
.crumbs{display:flex;align-items:center;gap:6px;font-size:0.85rem;color:var(--ink-soft);margin-bottom:16px;flex-wrap:wrap;}
.crumbs span.sep{opacity:0.5;}
.crumbs button{background:none;border:none;color:var(--ink-soft);font-size:0.85rem;text-decoration:underline;text-underline-offset:3px;padding:2px 0;}
.crumbs button:hover{color:var(--ink);}
.crumbs .current{color:var(--ink);font-weight:600;}

/* ---------- Home: subject shelf ---------- */
.hero{margin:8px 0 28px;}
.hero h1{font-size:1.9rem;margin:0 0 4px;font-weight:600;}
.hero p{color:var(--ink-soft);margin:0;font-size:0.98rem;}
.shelf{display:grid;grid-template-columns:repeat(auto-fit, minmax(220px,1fr));gap:18px;}
.book{
  position:relative;border-radius:var(--radius);padding:22px 20px 20px;min-height:210px;
  color:#fff;overflow:hidden;box-shadow:var(--shadow);border:none;text-align:left;
  display:flex;flex-direction:column;justify-content:space-between;
  transition:transform .18s ease, box-shadow .18s ease;
}
.book:hover{transform:translateY(-4px);box-shadow:var(--shadow-lift);}
.book::before{content:"";position:absolute;left:0;top:0;bottom:0;width:14px;background:rgba(0,0,0,0.18);}
.book::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,0.10);}
.book .emoji{font-size:2.1rem;}
.book .titles{margin-top:14px;}
.book .titles .en{font-family:'Baloo 2',sans-serif;font-size:1.35rem;font-weight:600;line-height:1.15;}
.book .titles .native{font-size:0.85rem;opacity:0.85;margin-top:3px;}
.book .native.urdu-native{font-family:'Noto Nastaliq Urdu',serif;font-size:1.1rem;direction:rtl;}
.book .progress-row{display:flex;align-items:center;gap:8px;margin-top:16px;font-size:0.78rem;opacity:0.92;}
.book .progress-track{flex:1;height:6px;border-radius:4px;background:rgba(255,255,255,0.28);overflow:hidden;}
.book .progress-fill{height:100%;background:#fff;border-radius:4px;}

/* ---------- Section card ---------- */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);}
.section-title{display:flex;align-items:center;gap:10px;margin:26px 0 12px;}
.section-title h2{font-size:1.05rem;margin:0;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;font-family:'Work Sans',sans-serif;}
.section-title .rule{flex:1;height:1px;background:var(--line);}

/* ---------- Chapter list ---------- */
.unit-block{margin-bottom:22px;}
.unit-title{font-family:'Baloo 2',sans-serif;font-size:1.15rem;font-weight:600;margin:0 0 10px;padding-bottom:8px;border-bottom:2px solid var(--line);}
.chapter-row{
  display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--radius-sm);
  background:#fff;margin-bottom:8px;transition:border-color .15s, transform .15s;
}
.chapter-row.clickable{cursor:pointer;}
.chapter-row.clickable:hover{border-color:var(--accent,#999);transform:translateX(3px);}
.chapter-row.locked{opacity:0.55;}
.chapter-num{width:34px;height:34px;border-radius:50%;background:var(--paper-2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.82rem;color:var(--ink-soft);flex-shrink:0;}
.chapter-main{flex:1;min-width:0;}
.chapter-main .t{font-weight:600;font-size:0.98rem;}
.chapter-main .s{font-size:0.78rem;color:var(--ink-soft);margin-top:2px;}
.badge{font-size:0.7rem;padding:4px 9px;border-radius:20px;font-weight:600;white-space:nowrap;}
.badge.ready{background:var(--good-bg);color:var(--good);}
.badge.soon{background:var(--paper-2);color:var(--ink-soft);}
.badge.done{background:var(--gold);color:#fff;}
.chev{color:var(--ink-soft);font-size:1.1rem;}

/* ---------- Buttons ---------- */
.btn{border-radius:30px;padding:13px 24px;font-weight:600;font-size:0.95rem;border:none;display:inline-flex;align-items:center;gap:8px;justify-content:center;transition:transform .15s ease, box-shadow .15s ease;}
.btn:hover{transform:translateY(-1px);}
.btn-primary{background:var(--ink);color:#fff;box-shadow:var(--shadow);}
.btn-outline{background:#fff;color:var(--ink);border:1.5px solid var(--line);}
.btn-block{width:100%;}
.btn:disabled{opacity:0.5;cursor:not-allowed;transform:none;}
.btn-sm{padding:9px 16px;font-size:0.85rem;}

/* ---------- Chapter intro ---------- */
.intro-hero{border-radius:var(--radius);padding:28px 24px;color:#fff;position:relative;overflow:hidden;margin-bottom:20px;}
.intro-hero::after{content:"";position:absolute;right:-40px;bottom:-60px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.08);}
.intro-hero .eyebrow{font-size:0.78rem;text-transform:uppercase;letter-spacing:.08em;opacity:.85;}
.intro-hero h2{margin:6px 0 8px;font-size:1.6rem;}
.intro-stats{display:flex;gap:22px;margin-top:16px;flex-wrap:wrap;}
.intro-stats div{font-size:0.82rem;opacity:0.92;}
.intro-stats b{display:block;font-size:1.15rem;font-family:'Baloo 2',sans-serif;}
.action-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px;}

/* ---------- Quiz ---------- */
.quiz-progress{display:flex;align-items:center;gap:12px;margin-bottom:20px;}
.quiz-progress .track{flex:1;height:8px;border-radius:6px;background:var(--paper-2);overflow:hidden;}
.quiz-progress .fill{height:100%;border-radius:6px;background:var(--accent,#B8622E);transition:width .3s ease;}
.quiz-progress .count{font-size:0.85rem;color:var(--ink-soft);font-weight:600;white-space:nowrap;}
.q-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:26px 24px;box-shadow:var(--shadow);}
.q-type-tag{display:inline-block;font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:4px 10px;border-radius:20px;background:var(--paper-2);color:var(--ink-soft);margin-bottom:14px;}
.q-text{font-family:'Baloo 2',sans-serif;font-size:1.28rem;font-weight:600;line-height:1.4;margin-bottom:20px;}
.q-text.urdu{font-family:'Noto Nastaliq Urdu',serif;font-size:1.5rem;line-height:2.1;}
.speak-btn{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font-size:0.78rem;color:var(--ink-soft);margin-bottom:14px;display:inline-flex;gap:6px;align-items:center;}
.opt{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1.5px solid var(--line);border-radius:var(--radius-sm);margin-bottom:10px;transition:border-color .15s, background .15s;}
.opt:hover{border-color:var(--accent,#B8622E);}
.opt.selected{border-color:var(--accent,#B8622E);background:color-mix(in srgb, var(--accent,#B8622E) 8%, white);}
.opt input{accent-color:var(--accent,#B8622E);width:18px;height:18px;flex-shrink:0;}
.opt label{flex:1;cursor:pointer;font-size:0.97rem;}
.tf-row{display:flex;gap:12px;}
.tf-row .opt{flex:1;justify-content:center;text-align:center;font-weight:600;}
textarea.answer-box{width:100%;min-height:110px;border:1.5px solid var(--line);border-radius:var(--radius-sm);padding:14px;font-family:inherit;font-size:0.97rem;resize:vertical;}
textarea.answer-box.urdu{font-family:'Noto Nastaliq Urdu',serif;font-size:1.2rem;direction:rtl;}
.answer-tabs{display:flex;gap:8px;margin-bottom:12px;}
.answer-tabs button{flex:1;padding:9px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:0.85rem;color:var(--ink-soft);}
.answer-tabs button.active{border-color:var(--accent,#B8622E);color:var(--accent,#B8622E);background:color-mix(in srgb, var(--accent,#B8622E) 8%, white);}
.upload-zone{border:2px dashed var(--line);border-radius:var(--radius-sm);padding:24px;text-align:center;color:var(--ink-soft);font-size:0.88rem;}
.upload-zone img{max-width:100%;max-height:220px;border-radius:10px;margin-top:10px;}
.q-nav{display:flex;justify-content:space-between;margin-top:22px;gap:10px;}

/* ---------- Results ---------- */
.result-hero{text-align:center;padding:34px 20px;}
.score-ring{width:150px;height:150px;border-radius:50%;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;position:relative;}
.score-ring .num{font-family:'Baloo 2',sans-serif;font-size:2.3rem;font-weight:700;}
.score-ring .unit{font-size:0.9rem;color:var(--ink-soft);position:absolute;bottom:28px;}
.result-msg{font-family:'Baloo 2',sans-serif;font-size:1.4rem;margin:6px 0 4px;}
.result-sub{color:var(--ink-soft);font-size:0.92rem;margin-bottom:22px;}
.review-item{border:1px solid var(--line);border-radius:var(--radius-sm);padding:16px;margin-bottom:10px;}
.review-item.correct{border-left:4px solid var(--good);}
.review-item.partial{border-left:4px solid var(--gold);}
.review-item.incorrect{border-left:4px solid var(--bad);}
.review-q{font-weight:600;margin-bottom:6px;}
.review-tag{font-size:0.72rem;font-weight:700;text-transform:uppercase;padding:3px 9px;border-radius:20px;margin-left:8px;}
.review-tag.correct{background:var(--good-bg);color:var(--good);}
.review-tag.partial{background:#FBF1D6;color:#8A6D0E;}
.review-tag.incorrect{background:var(--bad-bg);color:var(--bad);}
.review-feedback{font-size:0.88rem;color:var(--ink-soft);margin-top:6px;}
.result-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:26px;}
@media (max-width:520px){.result-actions{grid-template-columns:1fr;}}

/* ---------- Parent dashboard ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px;}
.stat-box{background:#fff;border:1px solid var(--line);border-radius:var(--radius-sm);padding:16px;text-align:center;}
.stat-box .n{font-family:'Baloo 2',sans-serif;font-size:1.7rem;font-weight:700;}
.stat-box .l{font-size:0.78rem;color:var(--ink-soft);margin-top:2px;}
table.dash-table{width:100%;border-collapse:collapse;font-size:0.88rem;}
table.dash-table th{text-align:left;padding:8px 10px;color:var(--ink-soft);font-weight:600;border-bottom:2px solid var(--line);font-size:0.78rem;text-transform:uppercase;letter-spacing:.04em;}
table.dash-table td{padding:10px 10px;border-bottom:1px solid var(--line);}

/* ---------- Loading / empty ---------- */
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--paper-2);border-top-color:var(--ink);animation:spin 0.8s linear infinite;margin:0 auto;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-block{text-align:center;padding:50px 20px;color:var(--ink-soft);}
.empty-block{text-align:center;padding:40px 20px;color:var(--ink-soft);}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:30px;font-size:0.85rem;box-shadow:var(--shadow-lift);z-index:50;}

/* ---------- kid-friendly flourishes ---------- */
.book{border-radius:24px;}
.book .emoji{font-size:2.4rem; display:inline-block;}
.book:hover{transform:translateY(-6px) rotate(-1deg);}
.btn{border-radius:999px;}
.btn-primary{background:linear-gradient(135deg,#FF8A5B,#E85D75);box-shadow:0 8px 18px rgba(232,93,117,.35);}
.btn-primary:hover{transform:translateY(-2px) scale(1.02);}
.mascot-row{display:flex;align-items:center;gap:14px;margin-bottom:18px;}
.mascot{font-size:2.2rem;flex-shrink:0;}
.speech-bubble{background:#fff;border:2px solid var(--line);border-radius:18px;padding:10px 16px;font-size:0.92rem;font-weight:600;position:relative;color:var(--ink);}
.speech-bubble:before{content:"";position:absolute;left:-8px;top:50%;transform:translateY(-50%);border:8px solid transparent;border-right-color:#fff;}
.chapter-num{background:linear-gradient(135deg,#FFE29A,#FFB27A);color:#7A4A00;}
.stat-box{border-radius:18px;}
.stat-box .n{color:var(--warn);}
.q-card{border-radius:24px;}
.opt{border-radius:16px;}
.confetti-wrap{position:relative;height:0;}
.confetti{position:absolute;top:0;font-size:1.4rem;animation:confetti-fall 1.8s ease-in forwards;}
@keyframes confetti-fall{0%{transform:translateY(-10px) rotate(0deg);opacity:1;}100%{transform:translateY(220px) rotate(360deg);opacity:0;}}
.model-answer{background:var(--paper-2);border-radius:16px;padding:16px 18px;margin-top:16px;font-size:0.92rem;line-height:1.6;}
.model-answer-label{font-weight:700;font-size:0.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);margin-bottom:6px;}
.self-check{margin-top:16px;}
.self-check-label{font-size:0.85rem;color:var(--ink-soft);margin-bottom:8px;font-weight:600;}
.self-check-row{display:flex;gap:8px;flex-wrap:wrap;}
.sc-btn{flex:1;min-width:120px;padding:11px 10px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:0.85rem;color:var(--ink-soft);}
.sc-btn.active.correct{border-color:var(--good);background:var(--good-bg);color:var(--good);}
.sc-btn.active.partial{border-color:var(--gold);background:#FBF1D6;color:#8A6D0E;}
.sc-btn.active.incorrect{border-color:var(--bad);background:var(--bad-bg);color:var(--bad);}

/* print */
@media print{
  .no-print{display:none !important;}
  body{background:#fff;}
  .q-card{box-shadow:none;border:1px solid #ccc;break-inside:avoid;}
}
</style>
</head>

<div id="app"></div>

    { id: "q12", type: "short", q: "What is a constitution?",

    { id: "q13", type: "short", q: "Name the three branches of government and briefly state what each does.",
      modelAnswer: "Executive — ensures laws passed by the legislature are implemented; Legislature/Parliament — makes and changes laws; Judiciary — ensures justice and upholds the rule of law." },
    { id: "q14", type: "short", q: "List any two responsibilities of Pakistani citizens mentioned in the chapter.",
      modelAnswer: "Any two of: vote for their representatives without bias, respect the civic rights of all citizens, follow the rule of law, not abuse access to public spaces, never harm the state or other people's life or property." },
    { id: "q15", type: "short", q: "What is democracy?",

    // --- additional questions from Know Your World ---
    { id: "q101", type: "short", q: "What is meant by Pakistan being a parliamentary democracy?",
      modelAnswer: "The people elect their representatives through elections held every five years. The party with a majority in the National Assembly forms the government." },
    { id: "q102", type: "short", q: "What are the responsibilities of the federal government?",
      modelAnswer: "Finance, defence, communications and foreign affairs. It sets priorities for spending public money, decides taxes, plans development, keeps the country financially stable and does not interfere in provincial affairs." },
    { id: "q103", type: "short", q: "State the economic goals of the federal government.",
      modelAnswer: "Economic growth and development; employment for all willing to work; stable prices of goods and services; distribution of resources between federal and provincial governments." },
    { id: "q104", type: "short", q: "What is the federal budget, and who presents it?",
      modelAnswer: "A plan for the coming year listing the goals to be met. The Finance Minister presents it in the National Assembly each June." },
    { id: "q105", type: "short", q: "When does Pakistan’s fiscal year begin and end?",
      modelAnswer: "It begins on 1 July and ends on 30 June the next year." },
    { id: "q106", type: "short", q: "Why is it important to follow the constitution?",
      modelAnswer: "It is a social contract between the government and the people; it keeps checks and balances on people in authority; it protects the rights of all citizens including minorities; and it helps stop the misuse of power." },
    { id: "q107", type: "short", q: "List any three rights of the citizens of Pakistan under the 1973 Constitution.",
      modelAnswer: "Equality before the law; freedom to practise religion and protect language and culture; the right to a fair trial; freedom to move and gather peacefully; protection of life and liberty." },
    { id: "q108", type: "short", q: "Who becomes the prime minister of Pakistan?",
      modelAnswer: "The leader of the political party with the greatest number of seats in the National Assembly. He or she is the head of the federal government." },
    { id: "q109", type: "short", q: "What is the role of the Speaker and Deputy Speaker?",
      modelAnswer: "They are elected by the MNAs and maintain order during assembly sessions while members debate." },
    { id: "q110", type: "short", q: "What does the Executive branch do, and who is part of it?",
      modelAnswer: "It makes sure laws and decisions of the legislature are implemented. It includes the Prime Minister, the federal cabinet of ministers, and the civil service staff." },
    { id: "q111", type: "short", q: "What is the job of the Legislature?",
      modelAnswer: "To make new laws and change existing ones. A federal law must be passed by both the National Assembly and the Senate and needs the President’s assent." },
    { id: "q112", type: "short", q: "How is the President of Pakistan elected?",
      modelAnswer: "The President, the head of state, is elected by MNAs and MPAs." },
    { id: "q113", type: "short", q: "Describe how the Judiciary is organised.",
      modelAnswer: "The Supreme Court in Islamabad is the highest court; each province has a High Court in its capital; Session Courts deal with local legal matters in each district." },
    { id: "q114", type: "short", q: "Describe the stages of law-making in Pakistan.",
      modelAnswer: "1. A bill is drawn up. 2. The National Assembly debates and votes on it. 3. Committees consider it and the Senate debates and votes. 4. If the President approves and signs it, it becomes law; otherwise it is sent back for changes." },
    { id: "q115", type: "short", q: "What is the difference between rules and laws?",
      modelAnswer: "Rules set boundaries for our actions and can be made by anyone. Laws are made by governments, and courts and police punish people who break them." },
    { id: "q116", type: "short", q: "What is the rule of law, and why is it important?",
      modelAnswer: "The laws apply equally to every citizen and no one is above the law. It makes people feel secure, protects their rights and discourages crime." },
    { id: "q117", type: "short", q: "What is a political party’s manifesto?",
      modelAnswer: "A document that states the policies and programmes of the party, helping people decide whether to join or vote for it." },
    { id: "q118", type: "short", q: "State the functions of political parties in a democracy.",
      modelAnswer: "They nominate candidates; the winning party forms the government and runs ministries according to its manifesto; members propose new laws; the opposition checks and criticises the ruling party; local leaders take people’s problems to the government." },
    { id: "q119", type: "short", q: "Explain the interdependence between federal, provincial and local governments.",
      modelAnswer: "The federal government distributes funds and resources to the provinces; provinces set up and fund local governments; local governments pass information about people’s needs back to higher levels. None can be fully effective without the others." },

    { id: "q113", type: "short", q: "Which province do these leaders belong to: Qazi Muhammad Isa, Sir Abdullah Haroon, Begum Jahan Ara Shahnawaz, Sardar Abdur Rab Nishtar?",
      modelAnswer: "Qazi Muhammad Isa – Balochistan; Sir Abdullah Haroon – Sindh; Begum Jahan Ara Shahnawaz – Punjab; Sardar Abdur Rab Nishtar – NWFP (Khyber Pakhtunkhwa)." },
    { id: "q114", type: "short", q: "Name some leaders from Bengal who contributed to the making of Pakistan.",
      modelAnswer: "Nawab Sir Saleemullah, Hussain Shaheed Suhrawardy, A. K. Fazlul Haq and Moulvi Tamizuddin." },
    { id: "q115", type: "short", q: "How did Azad Jammu and Kashmir and Gilgit-Baltistan come about?",
      modelAnswer: "Most people of Jammu and Kashmir were Muslims who wanted to join Pakistan, but Maharaja Hari Singh wished to join India. The local people fought and liberated some areas, now Azad Jammu and Kashmir and Gilgit-Baltistan." },
    { id: "q116", type: "short", q: "Write a short note on the role of minorities in the creation of Pakistan.",
      modelAnswer: "The Muslim League worked for minority representation, so many minorities supported it. Dewan Bahadur Singha declared Christians should be counted with Muslims. Quaid-e-Azam made Jogendra Nath Mandal the first Law Minister and promised freedom of religion. Many minorities stayed in Pakistan; Parsis helped set up businesses." },
    { id: "q117", type: "short", q: "Who was the first Law Minister of Pakistan?",
      modelAnswer: "Jogendra Nath Mandal." },
    { id: "q118", type: "short", q: "How many seats are reserved for religious minorities in the National Assembly today?",
      modelAnswer: "10 seats." },
    { id: "q119", type: "short", q: "What role did the Muslim League play in uniting Muslims for independence in 1947?",
      modelAnswer: "It organised Muslims, passed the Lahore Resolution, created awareness through provincial branches and students, won Muslim-majority areas in elections, and under Quaid-e-Azam led them to independence." },
    { id: "q120", type: "mcq", q: "When was the Lahore Resolution passed?",
      options: ["23 March 1940", "14 August 1947", "1 April 1936", "26 June 1947"], answer: 0 },
    { id: "q121", type: "mcq", q: "Who was the ruler of Kashmir at the time of partition?",
      options: ["Maharaja Hari Singh", "The Khan of Kalat", "Ranjit Singh", "Nawab Saleemullah"], answer: 0 },  ],

    { id: "q11", type: "short", q: "What are the five features of a map represented by BOLTS?",
      modelAnswer: "Border, Orientation, Legend, Title, and Scale." },
    { id: "q12", type: "short", q: "What is the difference between a political map and a physical map?",
      modelAnswer: "A political map shows the boundaries of a country, state, or city, while a physical map (topographical map) shows landforms and terrain like mountains and elevation." },
    { id: "q13", type: "short", q: "Why is longitude important for working out time zones?",
      modelAnswer: "The world is divided into 24 time zones based on longitude, with each zone covering about 15 degrees; time changes by an hour as you move 15° east or west of the Prime Meridian." },

    // --- additional questions from Know Your World ---
    { id: "q101", type: "short", q: "What is a map, and what can it show?",
      modelAnswer: "A map is a representation of an area on a flat surface. It can show countries, oceans, continents, physical features like mountains and rivers, and man-made features like roads and buildings." },
    { id: "q102", type: "short", q: "Describe the use of BOLTS on a map.",
      modelAnswer: "Border – a frame so the map stands out; Orientation – a compass rose or North arrow showing how to hold the map; Legend (key) – symbols, colours and signs for features; Title – tells what the map shows; Scale – shows how real distances are reduced." },
    { id: "q103", type: "short", q: "What is a legend (key) on a map?",
      modelAnswer: "The symbols, colours or signs used to show features such as mountains, buildings and trees." },
    { id: "q104", type: "short", q: "Why are maps drawn to scale?",
      modelAnswer: "It is impossible to draw a life-size map, so the actual size of an area is reduced by a constant factor." },
    { id: "q105", type: "short", q: "What does a representative scale of 1:100,000 mean?",
      modelAnswer: "Each centimetre on the map represents 100,000 cm (1 km) of actual distance." },
    { id: "q106", type: "short", q: "What is a linear scale?",
      modelAnswer: "A scale divided into equal parts that shows the relationship between a distance on the map and the actual distance on the Earth." },
    { id: "q107", type: "short", q: "How can you measure the length of a road or river on a map?",
      modelAnswer: "Lay a thread along the road or river from start to end, mark the thread, then place it along the map’s scale starting at 0 and read off the distance." },
    { id: "q108", type: "short", q: "Describe the types of maps.",
      modelAnswer: "Physical (topographical) maps show landforms and elevation; political maps show boundaries; climate maps show weather patterns; road maps show roads, highways and railways; tourist maps show landmarks, hotels, museums and transport." },
    { id: "q109", type: "short", q: "Which map is used to show roads in a city?",
      modelAnswer: "A road map." },
    { id: "q110", type: "short", q: "Which map is used to find the climate of an area, and who uses it?",
      modelAnswer: "A climate map. It helps farmers, scientists and travellers understand the climate of a region." },
    { id: "q111", type: "short", q: "What are lines of latitude?",
      modelAnswer: "Imaginary lines running east to west, parallel to the Equator. They measure distance north and south of the Equator in degrees." },
    { id: "q112", type: "short", q: "What are lines of longitude?",
      modelAnswer: "Imaginary lines drawn north to south that meet at the Poles. They measure distance east or west of the Prime Meridian in degrees." },
    { id: "q113", type: "short", q: "What is the main difference between the Equator and the Prime Meridian?",
      modelAnswer: "The Equator is 0° latitude, running east–west and dividing the Earth into Northern and Southern Hemispheres. The Prime Meridian is 0° longitude, running north–south through Greenwich, dividing the Eastern and Western Hemispheres." },
    { id: "q114", type: "short", q: "How many lines of longitude are there in total?",
      modelAnswer: "360 — 180 east and 180 west of the Prime Meridian." },
    { id: "q115", type: "short", q: "At which latitude and longitude is Pakistan found?",
      modelAnswer: "Around 30°N and 67°E, on the continent of Asia." },
    { id: "q116", type: "short", q: "How do pilots use latitude and longitude? Give an example.",
      modelAnswer: "Navigation systems and GPS use coordinates to plan routes. Flying from Karachi (25°N, 67°E) to London (55°N, 0°), a pilot knows London is north-west." },
    { id: "q117", type: "short", q: "Explain the relationship between longitude and time zones.",
      modelAnswer: "Longitude divides the world into 24 time zones of 15° each. Travelling east of the Prime Meridian, time goes forward 1 hour for every 15°; travelling west, it goes back 1 hour." },
    { id: "q118", type: "short", q: "How many hours is Karachi ahead of London, and how far is New York behind?",
      modelAnswer: "Karachi is 5 hours ahead of London; New York is 4 hours behind London." },
    { id: "q119", type: "short", q: "What is the International Date Line?",
      modelAnswer: "The line of longitude at 180°. When it is crossed, the date changes by one day." },
    { id: "q120", type: "mcq", q: "How many time zones is the world divided into?",
      options: ["24", "12", "15", "360"], answer: 0 },
    { id: "q121", type: "tf", q: "Lines of longitude are drawn vertically and meet at the poles.", answer: true },  ],

    { id: "q101", type: "short", q: "What is a weather chart, and what does it tell us?",

    { id: "q106", type: "short", q: "Why do regions near the Equator have a hot climate? Name some such countries.",

    { id: "q6", type: "short", q: "امام جعفر صادق علیہ السلام نے اپنی وصیت میں کن لوگوں کے نام تحریر فرمائے؟",
      modelAnswer: "امام نے پانچ افراد کی وصیت کی: منصور دوانیقی، سربراہ مدینہ، عبداللہ (اپنے بیٹے)، حمیدہ خاتون (امام کاظم کی والدہ)، اور حضرت امام موسیٰ کاظم علیہ السلام (حقیقی وصی)۔" },
  ],
};

// ============================================================
// STUDY COMPANION — App logic
// Standalone, single-file, works fully offline in any browser.
// No accounts, no server, no data leaves the device — every
// child's results live only in their own browser tab for that
// sitting, then reset. Nothing is shared between children.
// ============================================================

const state = {
  screen: "home",
  subjectId: null,
  chapterId: null,
  quiz: null,        // {questions:[], idx, answers:{}}
  results: null,
  fontScale: 1,
};

// In-memory only (resets on page reload) — used so "Play Again"
// rotates in a couple of new questions instead of repeating the
// exact same quiz, and so a chapter shows "last score" during this
// sitting. None of this is saved anywhere.
const sessionMemory = { lastQuiz: {}, lastScore: {} };

const $app = document.getElementById("app");
const esc = (s) => (s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function findSubject(id) { return SUBJECTS.find(s => s.id === id); }
function findChapter(subjectId, chapterId) {
  const subj = findSubject(subjectId);
  if (!subj) return null;
  for (const u of subj.units) {
    const c = u.chapters.find(c => c.id === chapterId);
    if (c) return { chapter: c, unit: u, subject: subj };
  }
  return null;
}
function nextChapterOf(subjectId, chapterId) {
  const subj = findSubject(subjectId);
  const flat = [];
  subj.units.forEach(u => u.chapters.forEach(c => flat.push(c)));
  const idx = flat.findIndex(c => c.id === chapterId);
  for (let i = idx + 1; i < flat.length; i++) if (flat[i].hasQuiz) return flat[i];
  return null;
}
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ---------------- quiz building ----------------
// Every quiz uses nearly the whole bank: only a few questions (2–3, or ~10%
// for big banks) are held back. On Play Again, the questions held back last
// time are always included, so every question is asked within two rounds.
function chapterMeta(chapterId) {
  const found = state.subjectId ? findChapter(state.subjectId, chapterId) : null;
  return found ? found.chapter : null;
}
function holdBackFor(total) {
  if (total <= 6) return 0;          // small banks: ask everything
  if (total <= 12) return 1;
  return Math.min(Math.max(2, Math.round(total * 0.1)), 4);
}
function roundSizeFor(chapterId, total) {
  return Math.max(1, total - holdBackFor(total));
}
function bankProgress(chapterId, total) {
  const seen = (sessionMemory.seen && sessionMemory.seen[chapterId]) || [];
  return Math.min(seen.length, total);
}
function buildQuiz(chapterId) {
  const bank = QUESTION_BANKS[chapterId] || [];
  const total = bank.length;
  if (total === 0) return [];
  const quizSize = roundSizeFor(chapterId, total);
  const last = (sessionMemory.lastQuiz[chapterId] || []).filter(id => bank.some(q => q.id === id));
  let selectedIds;
  if (last.length === 0) {
    selectedIds = shuffle(bank.map(q => q.id)).slice(0, quizSize);
  } else {
    const leftOut = shuffle(bank.map(q => q.id).filter(id => !last.includes(id)));
    const fromLast = shuffle(last).slice(0, Math.max(0, quizSize - leftOut.length));
    selectedIds = leftOut.slice(0, quizSize).concat(fromLast);
  }
  let picked = selectedIds.map(id => bank.find(q => q.id === id)).filter(Boolean);
  // Reading Circle (Q&A) chapters keep story order; other chapters are shuffled.
  const meta = chapterMeta(chapterId);
  if (meta && meta.qa) picked.sort((x, y) => bank.indexOf(x) - bank.indexOf(y));
  else picked = shuffle(picked);
  if (!picked.some(q => q.type === "short")) {
    const short = bank.find(q => q.type === "short");
    if (short) picked[picked.length - 1] = short;
  }
  picked = picked.map(q => {
    if (q.type === "mcq") {
      const order = shuffle(q.options.map((_, i) => i));
      return { ...q, displayOptions: order.map(i => q.options[i]), correctDisplayIndex: order.indexOf(q.answer) };
    }
    return q;
  });
  sessionMemory.lastQuiz[chapterId] = picked.map(q => q.id);
  sessionMemory.seen = sessionMemory.seen || {};
  const seen = sessionMemory.seen[chapterId] || [];
  picked.forEach(q => { if (!seen.includes(q.id)) seen.push(q.id); });
  sessionMemory.seen[chapterId] = seen;
  return picked;
}

// ---------------- navigation ----------------
function go(screen, extra = {}) {
  Object.assign(state, { screen }, extra);
  window.scrollTo({ top: 0, behavior: "smooth" });
  render();
}

// ---------------- rendering ----------------
function render() {
  if (state.screen === "home") return renderHome();
  if (state.screen === "toc") return renderTOC();
  if (state.screen === "intro") return renderIntro();
  if (state.screen === "quiz") return renderQuiz();
  if (state.screen === "results") return renderResults();
}

function topbar(crumbs) {
  return `
  <div class="topbar no-print">
    <div class="brand" onclick="go('home')">
      <div class="brand-mark">📚</div>
      <div class="brand-text">Study Companion<small>Grade 5 · Practice &amp; Play</small></div>
    </div>
    <div class="top-actions">
      <div class="font-controls">
        <button onclick="changeFont(-1)" title="Smaller text">A−</button>
        <button onclick="changeFont(1)" title="Larger text">A+</button>
      </div>
    </div>
  </div>
  ${crumbs || ""}
  `;
}

function crumbBar(items) {
  const parts = items.map((it, i) => {
    if (i === items.length - 1) return `<span class="current">${esc(it.label)}</span>`;
    return `<button onclick="${it.action}">${esc(it.label)}</button><span class="sep">/</span>`;
  });
  return `<div class="crumbs no-print">${parts.join("")}</div>`;
}

// ---- HOME ----
function renderHome() {
  const cards = SUBJECTS.map(subj => {
    const total = subj.units.reduce((n, u) => n + u.chapters.filter(c => c.hasQuiz).length, 0);
    const nativeClass = subj.dir === "rtl" ? "native urdu-native" : "native";
    return `
    <button class="book" style="background:linear-gradient(160deg, ${subj.color}, ${subj.colorDark})" onclick="go('toc', {subjectId:'${subj.id}'})">
      <div class="emoji">${subj.emoji}</div>
      <div class="titles">
        <div class="en">${esc(subj.name)}</div>
        <div class="${nativeClass}">${esc(subj.nativeName)}</div>
      </div>
      <div class="progress-row">
        <span>${total} chapter${total === 1 ? "" : "s"} with quizzes</span>
      </div>
    </button>`;
  }).join("");

  $app.innerHTML = `
    ${topbar()}
    <div class="mascot-row">
      <div class="mascot">✨</div>
      <div class="speech-bubble">Ready to learn something new today? Pick a subject below!</div>
    </div>
    <div class="hero">
      <h1>What are we studying today?</h1>
      <p>Pick a subject to see its chapters and start a quiz.</p>
    </div>
    <div class="shelf">${cards}</div>
  `;
}

// ---- TABLE OF CONTENTS ----
function renderTOC() {
  const subj = findSubject(state.subjectId);
  const units = subj.units.map(u => {
    const rows = u.chapters.map(c => {
      let badge = `<span class="badge soon">Coming soon</span>`;
      let clickable = "locked";
      let onclick = "";
      if (c.hasQuiz) {
        clickable = "clickable";
        onclick = `onclick="go('intro', {subjectId:'${subj.id}', chapterId:'${c.id}'})"`;
        const last = sessionMemory.lastScore[c.id];
        badge = last != null
          ? `<span class="badge done">★ ${last}%</span>`
          : `<span class="badge ready">Ready</span>`;
      }
      return `
      <div class="chapter-row ${clickable}" style="--accent:${subj.color}" ${onclick}>
        <div class="chapter-num">${esc(c.num)}</div>
        <div class="chapter-main">
          <div class="t ${subj.dir === 'rtl' ? 'urdu' : ''}">${esc(c.title)}</div>
          <div class="s">${!c.hasQuiz ? 'Quiz not added yet' : c.qa ? `Question &amp; answer · ${(QUESTION_BANKS[c.id] || []).length} questions${c.author ? ' · ' + esc(c.author) : ''}` : 'Multiple choice, true/false &amp; written questions'}</div>
        </div>
        ${badge}
        ${c.hasQuiz ? '<span class="chev">›</span>' : ''}
      </div>`;
    }).join("");
    return `<div class="unit-block"><h3 class="unit-title ${subj.dir === 'rtl' ? 'urdu' : ''}">${esc(u.title)}</h3>${rows}</div>`;
  }).join("");

  $app.innerHTML = `
    ${topbar(crumbBar([
      { label: "Home", action: "go('home')" },
      { label: subj.name },
    ]))}
    <div class="hero">
      <h1>${esc(subj.emoji)} ${esc(subj.name)} <span style="color:var(--ink-soft);font-weight:400;">— ${esc(subj.nativeName)}</span></h1>
      <p>Table of contents. Chapters marked "Ready" already have a quiz.</p>
    </div>
    ${units}
  `;
}

// ---- CHAPTER INTRO ----
function renderIntro() {
  const { chapter, subject } = findChapter(state.subjectId, state.chapterId);
  const bankSize = (QUESTION_BANKS[chapter.id] || []).length;
  const roundSize = roundSizeFor(chapter.id, bankSize);
  const last = sessionMemory.lastScore[chapter.id];
  const isQA = !!chapter.qa;
  const covered = bankProgress(chapter.id, bankSize);

  $app.innerHTML = `
    ${topbar(crumbBar([
      { label: "Home", action: "go('home')" },
      { label: subject.name, action: `go('toc', {subjectId:'${subject.id}'})` },
      { label: chapter.title },
    ]))}
    <div class="intro-hero" style="background:linear-gradient(140deg, ${subject.color}, ${subject.colorDark})">
      <div class="eyebrow">${esc(subject.name)} · Chapter ${esc(chapter.num)}</div>
      <h2 class="${subject.dir === 'rtl' ? 'urdu' : ''}">${esc(chapter.title)}</h2>
      ${chapter.author ? `<div style="opacity:.9;font-size:0.95rem;">by ${esc(chapter.author)}</div>` : ""}
      <div class="intro-stats">
        <div><b>${roundSize}</b>questions this round</div>
        <div><b>${bankSize}</b>total in question bank</div>
        <div><b>${last != null ? last + '%' : '—'}</b>score this sitting</div>
        <div><b>${covered} / ${bankSize}</b>questions practised</div>
      </div>
      <div class="action-row no-print">
        <button class="btn btn-primary" onclick="startQuiz()">▶ Start Quiz</button>
        <button class="btn btn-outline" style="background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.4)" onclick="printPaper()">🖨 Print practice paper</button>
        <button class="btn btn-outline" style="background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.4)" onclick="printPaper(true)">📘 Print Q&amp;A with answers</button>
      </div>
    </div>
    <div class="card">
      <h3 style="margin-top:0;">How this works</h3>
      <ul style="color:var(--ink-soft);line-height:1.7;font-size:0.94rem;padding-left:20px;">
        ${isQA ? `
        <li>These are <b>question &amp; answer</b> practice questions — the kind your teacher asks in class, including the book's "Reference to context" and word-meaning questions.</li>
        <li>Each round gives you ${roundSize} of the ${bankSize} questions in story order. Say or write your answer, then check it against the model answer and mark yourself.</li>
        <li>Press Play Again and the questions you missed out last time are always included.</li>
        <li>Use "Print Q&amp;A with answers" for revision notes, or "Print practice paper" for a blank test.</li>` : `
        <li>You'll get a mix of multiple-choice, true/false, and written questions.</li>
        <li>For written questions, type your answer or write it in your book — after you submit, you'll see the model answer and mark yourself: correct, partially correct, or wrong answer.</li>
        <li>Each quiz uses ${roundSize} of the ${bankSize} questions in the bank. Press Play Again and the ones left out last time are always included.</li>`}
      </ul>
    </div>
  `;
}

function startQuiz() {
  const questions = buildQuiz(state.chapterId);
  state.quiz = { questions, idx: 0, answers: {} };
  go("quiz");
}

// ---- QUIZ ----
function renderQuiz() {
  const { chapter, subject } = findChapter(state.subjectId, state.chapterId);
  const { questions, idx } = state.quiz;
  const q = questions[idx];
  const isUrdu = subject.dir === "rtl";
  const pct = Math.round((idx / questions.length) * 100);
  const existing = state.quiz.answers[q.id];

  let body = "";
  if (q.type === "mcq") {
    body = q.displayOptions.map((opt, i) => `
      <div class="opt ${existing?.choice === i ? 'selected' : ''}" style="--accent:${subject.color}" onclick="selectMCQ(${i})">
        <input type="radio" name="mcq" ${existing?.choice === i ? "checked" : ""} readonly>
        <label class="${isUrdu ? 'urdu' : ''}">${esc(opt)}</label>
      </div>`).join("");
  } else if (q.type === "tf") {
    body = `<div class="tf-row">
      <div class="opt ${existing?.choice === true ? 'selected' : ''}" style="--accent:${subject.color}" onclick="selectTF(true)">
        <label>✔️ True</label>
      </div>
      <div class="opt ${existing?.choice === false ? 'selected' : ''}" style="--accent:${subject.color}" onclick="selectTF(false)">
        <label>❌ False</label>
      </div>
    </div>`;
  } else if (q.type === "short") {
    body = renderShortAnswer(q, existing, isUrdu);
  }

  $app.innerHTML = `
    ${topbar()}
    <div class="quiz-progress no-print">
      <div class="track"><div class="fill" style="width:${pct}%; background:${subject.color}"></div></div>
      <div class="count">${idx + 1} / ${questions.length}</div>
    </div>
    <div class="q-card" style="--accent:${subject.color}">
      <span class="q-type-tag">${q.type === 'mcq' ? 'Multiple choice' : q.type === 'tf' ? 'True or False' : 'Written answer'}</span>
      <button class="speak-btn no-print" onclick="speakCurrent()">🔊 Read aloud</button>
      <div class="q-text ${isUrdu ? 'urdu' : ''}">${esc(q.q)}</div>
      ${body}
    </div>
    <div class="q-nav no-print">
      <button class="btn btn-outline" onclick="${idx === 0 ? "go('intro',{subjectId:'" + subject.id + "',chapterId:'" + chapter.id + "'})" : "quizPrev()"}">${idx === 0 ? "Cancel" : "← Back"}</button>
      <button class="btn btn-primary" onclick="quizNext()" id="nextBtn">${idx === questions.length - 1 ? "Finish Quiz ✓" : "Next →"}</button>
    </div>
  `;
}

function renderShortAnswer(q, existing, isUrdu) {
  const mode = existing?.mode || "type";
  const revealed = existing?.revealed;
  const tabs = `
      <div class="answer-tabs no-print">
        <button class="${mode === 'type' ? 'active' : ''}" onclick="setShortMode('type')">⌨️ Type answer</button>
        <button class="${mode === 'photo' ? 'active' : ''}" onclick="setShortMode('photo')">📷 Attach photo</button>
      </div>`;
  const inputArea = mode === "type" ? `
        <textarea class="answer-box ${isUrdu ? 'urdu' : ''}" placeholder="${isUrdu ? 'اپنا جواب یہاں لکھیں' : 'Write your answer here...'}" oninput="setShortText(this.value)">${esc(existing?.text || "")}</textarea>
  ` : `
        <div class="upload-zone" id="uploadZone">
          ${existing?.imageData ? `<img src="${existing.imageData}"><div style="margin-top:8px;"><button class="btn btn-outline btn-sm no-print" onclick="document.getElementById('photoInput').click()">Replace photo</button></div>` :
          `<div>📷 Take or upload a photo of your handwritten answer</div><div style="margin-top:12px;"><button class="btn btn-outline btn-sm" onclick="document.getElementById('photoInput').click()">Choose photo</button></div>`}
        </div>
        <input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none" onchange="handlePhoto(this.files[0])">
  `;

  if (!revealed) {
    return `${tabs}${inputArea}
      <button class="btn btn-outline no-print" style="margin-top:14px;" onclick="revealModelAnswer()">Check my answer</button>`;
  }

  return `${tabs}${inputArea}
    <div class="model-answer">
      <div class="model-answer-label">📘 Model answer</div>
      <div class="${isUrdu ? 'urdu' : ''}">${esc(q.modelAnswer)}</div>
    </div>
    <div class="self-check no-print">
      <div class="self-check-label">Compare with your answer — how did you do?</div>
      <div class="self-check-row">
        <button class="sc-btn ${existing?.selfVerdict === 'correct' ? 'active correct' : ''}" onclick="setSelfVerdict('correct')">✅ Correct</button>
        <button class="sc-btn ${existing?.selfVerdict === 'partial' ? 'active partial' : ''}" onclick="setSelfVerdict('partial')">➗ Partially correct</button>
        <button class="sc-btn ${existing?.selfVerdict === 'incorrect' ? 'active incorrect' : ''}" onclick="setSelfVerdict('incorrect')">📖 Wrong answer</button>
      </div>
    </div>`;
}

function selectMCQ(i) {
  const q = state.quiz.questions[state.quiz.idx];
  state.quiz.answers[q.id] = { choice: i };
  renderQuiz();
}
function selectTF(v) {
  const q = state.quiz.questions[state.quiz.idx];
  state.quiz.answers[q.id] = { choice: v };
  renderQuiz();
}
function setShortMode(mode) {
  const q = state.quiz.questions[state.quiz.idx];
  const prev = state.quiz.answers[q.id] || {};
  state.quiz.answers[q.id] = { ...prev, mode };
  renderQuiz();
}
function setShortText(val) {
  const q = state.quiz.questions[state.quiz.idx];
  const prev = state.quiz.answers[q.id] || {};
  state.quiz.answers[q.id] = { ...prev, mode: "type", text: val };
}
function handlePhoto(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const q = state.quiz.questions[state.quiz.idx];
    const prev = state.quiz.answers[q.id] || {};
    state.quiz.answers[q.id] = { ...prev, mode: "photo", imageData: reader.result };
    renderQuiz();
  };
  reader.readAsDataURL(file);
}
function revealModelAnswer() {
  const q = state.quiz.questions[state.quiz.idx];
  const prev = state.quiz.answers[q.id] || {};
  state.quiz.answers[q.id] = { ...prev, revealed: true };
  renderQuiz();
}
function setSelfVerdict(v) {
  const q = state.quiz.questions[state.quiz.idx];
  const prev = state.quiz.answers[q.id] || {};
  state.quiz.answers[q.id] = { ...prev, selfVerdict: v };
  renderQuiz();
}

function speakCurrent() {
  const { subject } = findChapter(state.subjectId, state.chapterId);
  const q = state.quiz.questions[state.quiz.idx];
  speak(q.q, subject.dir === "rtl" ? "ur-PK" : "en-US");
}
function speak(text, lang) {
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang;
    u.rate = 0.95;
    window.speechSynthesis.speak(u);
  } catch (e) { /* speech not supported, ignore silently */ }
}

function quizPrev() {
  state.quiz.idx = Math.max(0, state.quiz.idx - 1);
  renderQuiz();
}
function quizNext() {
  const { questions, idx } = state.quiz;
  const q = questions[idx];
  if (q.type === "short") {
    const a = state.quiz.answers[q.id];
    if (!a || !a.revealed) { revealModelAnswer(); return; }
    if (!a.selfVerdict) { flashHint("Pick how you did before moving on."); return; }
  }
  if (idx < questions.length - 1) {
    state.quiz.idx++;
    renderQuiz();
  } else {
    finishQuiz();
  }
}
function flashHint(msg) {
  const existingToast = document.querySelector(".toast");
  if (existingToast) existingToast.remove();
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 1800);
}

// ---------------- scoring ----------------
function finishQuiz() {
  const { chapter, subject } = findChapter(state.subjectId, state.chapterId);
  const { questions, answers } = state.quiz;

  const items = questions.map(q => {
    const a = answers[q.id];
    let verdict;
    if (q.type === "mcq") verdict = (a && a.choice === q.correctDisplayIndex) ? "correct" : "incorrect";
    else if (q.type === "tf") verdict = (a && a.choice === q.answer) ? "correct" : "incorrect";
    else verdict = a?.selfVerdict || "incorrect";
    return { q, verdict };
  });

  const scoreValue = items.reduce((sum, r) => sum + (r.verdict === "correct" ? 1 : r.verdict === "partial" ? 0.5 : 0), 0);
  const pct = Math.round((scoreValue / items.length) * 100);
  sessionMemory.lastScore[chapter.id] = pct;

  state.results = { items, pct, chapter, subject };
  go("results");
}

// ---- RESULTS ----
function renderResults() {
  const { items, pct, chapter, subject } = state.results;
  const nextCh = nextChapterOf(subject.id, chapter.id);

  let msg, color;
  if (pct >= 90) { msg = "Outstanding! 🌟"; color = "var(--good)"; }
  else if (pct >= 70) { msg = "Great job! 👏"; color = "var(--good)"; }
  else if (pct >= 50) { msg = "Good effort — keep going! 💪"; color = "#8A6D0E"; }
  else { msg = "Let's practise this one again 📖"; color = "var(--bad)"; }

  const confettiEmojis = ["🎉", "⭐", "✨", "🎊", "🌟"];
  const confetti = pct >= 70 ? Array.from({ length: 14 }, (_, i) =>
    `<span class="confetti" style="left:${Math.random() * 100}%; animation-delay:${(Math.random() * 0.6).toFixed(2)}s; font-size:${1 + Math.random()}rem;">${confettiEmojis[i % confettiEmojis.length]}</span>`
  ).join("") : "";

  const reviews = items.map((r, i) => `
    <div class="review-item ${r.verdict}">
      <div class="review-q ${subject.dir === 'rtl' ? 'urdu' : ''}">${i + 1}. ${esc(r.q.q)}
        <span class="review-tag ${r.verdict}">${r.verdict}</span>
      </div>
      ${r.q.type === "mcq" ? `<div class="review-feedback">Correct answer: ${esc(r.q.options[r.q.answer])}</div>` : ""}
      ${r.q.type === "tf" ? `<div class="review-feedback">Correct answer: ${r.q.answer ? "True" : "False"}</div>` : ""}
      ${r.q.type === "short" ? `<div class="review-feedback">📘 ${esc(r.q.modelAnswer)}</div>` : ""}
    </div>
  `).join("");

  $app.innerHTML = `
    ${topbar()}
    <div class="card" style="overflow:hidden;">
      <div class="confetti-wrap">${confetti}</div>
      <div class="result-hero">
        <div class="score-ring" style="background:conic-gradient(${color} ${pct * 3.6}deg, var(--paper-2) 0deg)">
          <div class="score-ring" style="width:118px;height:118px;background:#fff;">
            <div class="num" style="color:${color}">${pct}%</div>
          </div>
        </div>
        <div class="result-msg">${msg}</div>
        <div class="result-sub">You got ${items.filter(r => r.verdict === 'correct').length} out of ${items.length} fully correct on <b>${esc(chapter.title)}</b>.</div>
      </div>
    </div>

    <div class="section-title"><h2>Review your answers</h2><div class="rule"></div></div>
    ${reviews}

    <div class="result-actions no-print">
      <button class="btn btn-primary" onclick="playAgain()">🔄 Play Again</button>
      <button class="btn btn-outline" ${nextCh ? `onclick="go('intro',{subjectId:'${subject.id}',chapterId:'${nextCh.id}'})"` : "disabled"}>⏭ ${nextCh ? "Next Chapter" : "No more chapters yet"}</button>
      <button class="btn btn-outline" onclick="go('toc',{subjectId:'${subject.id}'})">📑 Table of Contents</button>
      <button class="btn btn-outline" onclick="go('home')">🏠 Home</button>
    </div>
  `;
}

function playAgain() { startQuiz(); }

// ---- PRINT PAPER ----
function printPaper(withAnswers) {
  const { chapter, subject } = findChapter(state.subjectId, state.chapterId);
  const bank = QUESTION_BANKS[chapter.id] || [];
  const isUrdu = subject.dir === "rtl";
  const rows = bank.map((q, i) => {
    if (q.type === "mcq") {
      return `<div class="q-card" style="margin-bottom:14px;"><div class="q-text ${isUrdu ? 'urdu' : ''}" style="font-size:1.05rem;">${i + 1}. ${esc(q.q)}</div>
        ${q.options.map((o, j) => `<div style="margin:4px 0 4px 20px;">${String.fromCharCode(97 + j)}) ${esc(o)}</div>`).join("")}${withAnswers ? `<div class="ans">Answer: ${esc(q.options[q.answer])}</div>` : ""}</div>`;
    }
    if (q.type === "tf") {
      return `<div class="q-card" style="margin-bottom:14px;"><div class="q-text ${isUrdu ? 'urdu' : ''}" style="font-size:1.05rem;">${i + 1}. ${esc(q.q)} <span style="color:var(--ink-soft);font-size:0.85rem;">(True / False)</span></div>${withAnswers ? `<div class="ans">Answer: ${q.answer ? "True" : "False"}</div>` : ""}</div>`;
    }
    return `<div class="q-card" style="margin-bottom:14px;"><div class="q-text ${isUrdu ? 'urdu' : ''}" style="font-size:1.05rem;">${i + 1}. ${esc(q.q)}</div>${withAnswers ? `<div class="ans ${isUrdu ? 'urdu' : ''}">${isUrdu ? '' : 'Ans: '}${esc(q.modelAnswer)}</div>` : `<div style="border-bottom:1px solid #ccc;height:60px;margin-top:10px;"></div>`}</div>`;
  }).join("");

  const win = window.open("", "_blank");
  win.document.write(`
    <html><head><title>${esc(chapter.title)} — ${withAnswers ? "Questions & Answers" : "Practice Paper"}</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600&family=Work+Sans&family=Noto+Nastaliq+Urdu&display=swap" rel="stylesheet">
    <style>
      body{font-family:'Work Sans',sans-serif;max-width:800px;margin:30px auto;color:#222;}
      h1{font-family:'Baloo 2',sans-serif;}
      .urdu{font-family:'Noto Nastaliq Urdu',serif;direction:rtl;font-size:1.3rem;line-height:2;}
      .q-card{border:1px solid #ccc;border-radius:10px;padding:14px 16px;break-inside:avoid;}
      .ans{margin-top:8px;padding:8px 12px;background:#f3efe4;border-radius:8px;font-size:0.95rem;line-height:1.5;}
    </style></head><body>
    <h1>${esc(subject.name)} — ${esc(chapter.title)}${withAnswers ? " (Questions &amp; Answers)" : ""}</h1>
    ${withAnswers ? "" : "<p>Name: _______________________ &nbsp;&nbsp; Date: _______________</p>"}
    ${rows}
    </body></html>
  `);
  win.document.close();
  setTimeout(() => win.print(), 400);
}

// ---- font size ----
function changeFont(delta) {
  state.fontScale = Math.min(1.3, Math.max(0.85, state.fontScale + delta * 0.075));
  document.documentElement.style.setProperty("--font-scale", state.fontScale);
}

// ---- init ----
render();

</script>
</body>
</html>
